<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anderson Coutinho — Designer Freelancer</title>
  <style>
    /* =========================
       FONTES
       Coloque os arquivos das fontes nesta pasta: /fonts
       - Charge Vector Black  → fonts/ChargeVector-Black.woff2
       - Charge Vector Thin   → fonts/ChargeVector-Thin.woff2
       ========================= */
    @font-face {
      font-family: 'Charge Vector';
      src: url('fonts/ChargeVector-Thin.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Charge Vector';
      src: url('fonts/ChargeVector-Black.woff2') format('woff2');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    :root{
      --bg:#0c2127; /* azul petróleo escuro */
      --card:#0f2b33;
      --text:#ecf4f6;
      --muted:#a3bdc4;
      --accent:#21e6a9;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family: 'Charge Vector', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display:flex; align-items:flex-start; justify-content:center;
    }

    .wrap{width:min(1100px, 94vw); padding:24px 20px 56px}

    header{display:grid; grid-template-columns: 160px 1fr; gap:24px; align-items:center}

    .avatar{
      width:160px; height:160px; border-radius:12px; overflow:hidden;
      box-shadow:0 8px 24px rgba(0,0,0,.35);
      border:2px solid rgba(255,255,255,.06);
    }
    .avatar img{width:100%; height:100%; object-fit:cover}

    .titles h1{margin:0; line-height:.95; font-weight:900; letter-spacing:.02em; font-size: clamp(28px, 4.8vw, 56px)}
    .titles .subtitle{margin-top:8px; font-weight:300; letter-spacing:.08em; font-size: clamp(14px, 2.2vw, 22px); color:var(--muted)}

    /* Seções clicáveis */
    .grid{display:grid; grid-template-columns: repeat(3, 1fr); gap:22px; margin:34px 0}
    .tile{
      background:var(--card); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:24px; text-align:center; cursor:pointer;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
      position:relative;
    }
    .tile:hover{ transform: translateY(-2px); box-shadow:0 10px 22px rgba(0,0,0,.35); border-color: rgba(33, 230, 169, .45)}
    .dot{width:10px; height:10px; border-radius:50%; background:var(--accent); margin:0 auto 12px}
    .tile h3{ margin: 0; font-weight:900; letter-spacing:.02em; font-size: clamp(16px, 2.2vw, 22px)}
    .tile p{ margin:8px 0 0; color:var(--muted); font-weight:300; font-size:14px; letter-spacing:.04em}

    /* Showcase imagem central opcional */
    .showcase{display:flex; justify-content:center;}
    .showcase img{ width:min(560px, 85vw); border-radius:12px; border:1px solid rgba(255,255,255,.06); box-shadow:0 10px 26px rgba(0,0,0,.35)}

    /* Contato */
    .contact{margin:38px 0 0; text-align:center}
    .contact h2{font-weight:900; letter-spacing:.06em; margin:0 0 12px}
    .whats{display:inline-flex; align-items:center; justify-content:center; width:90px; height:90px; border-radius:50%; background:transparent; border:2px solid var(--text); transition: transform .1s ease, background .2s ease}
    .whats:hover{ transform: scale(1.03); background:rgba(255,255,255,.04)}
    .whats img{width:60%; height:60%}

    /* Lightbox / Slider */
    .lightbox{ position: fixed; inset:0; background: rgba(3, 10, 12, .92); display:none; align-items:center; justify-content:center; z-index:99;}
    .lightbox.open{display:flex}
    .lightbox .frame{ width:min(1000px, 94vw); max-height:90vh; display:flex; flex-direction:column; gap:10px;}
    .lightbox .hero{ position:relative; background:#061417; border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:14px; display:flex; align-items:center; justify-content:center; min-height:280px}
    .lightbox img{ max-width:100%; max-height:72vh; object-fit:contain; border-radius:8px}
    .lightbox .bar{ display:flex; align-items:center; justify-content:space-between; gap:10px;}
    .bar .label{ font-weight:900; letter-spacing:.06em}
    .bar .controls{ display:flex; gap:8px}
    .btn{ background:var(--card); color:var(--text); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:8px 12px; cursor:pointer}
    .btn:hover{ border-color: var(--accent)}

    /* Responsivo */
    @media (max-width: 780px){
      header{ grid-template-columns: 1fr; text-align:center}
      .avatar{ margin: 0 auto}
      .grid{ grid-template-columns: 1fr }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <!-- TOPO -->
    <header>
      <figure class="avatar" aria-label="Foto do Anderson">
        <!-- Substitua a imagem abaixo pela sua foto -->
        <img src="https://i.imgur.com/vMJeLAx.png" alt="Anderson com óculos e caneta" />
      </figure>
      <div class="titles">
        <h1>ANDERSON<br/>COUTINHO</h1>
        <div class="subtitle">DESIGNER FREELANCER</div>
      </div>
    </header>

    <!-- BLOCOS CLICÁVEIS -->
    <section class="grid" aria-label="Categorias do portfólio">
      <article class="tile" data-gallery="modelos3d" tabindex="0" role="button" aria-label="Abrir galeria de Modelos 3D">
        <div class="dot" aria-hidden="true"></div>
        <h3>MODELOS 3D</h3>
        <p>para impressão</p>
      </article>
      <article class="tile" data-gallery="ilustracoes" tabindex="0" role="button" aria-label="Abrir galeria de Ilustrações">
        <div class="dot" aria-hidden="true"></div>
        <h3>ILUSTRAÇÕES</h3>
        <p>trabalhos autorais e sob demanda</p>
      </article>
      <article class="tile" data-gallery="midias" tabindex="0" role="button" aria-label="Abrir galeria de Artes para Mídias Sociais">
        <div class="dot" aria-hidden="true"></div>
        <h3>ARTES PARA<br/>MÍDIAS SOCIAIS</h3>
        <p>posts, capas e campanhas</p>
      </article>
    </section>

    <!-- IMAGEM DE DESTAQUE (opcional) -->
    <section class="showcase" aria-hidden="true">
      <img src="https://cndl.org.br/varejosa/wp-content/uploads/2022/08/shutterstock_1614142333.jpg" alt="Exemplo de escultura 3D" />
    </section>

    <!-- CONTATO -->
    <section class="contact">
      <h2>CONTATO</h2>
      <a class="whats" href="https://wa.me/5555992218122" target="_blank" rel="noopener" aria-label="Abrir conversa no WhatsApp">
        <!-- Ícone do WhatsApp em SVG para nitidez -->
        <img alt="WhatsApp" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512'%3E%3Cpath fill='white' d='M380.9 97.1C339 55.1 283.2 32 223.9 32 103.5 32 4 131.5 4 251.9c0 43.9 11.5 86.6 33.5 124L0 480l106.8-37.9c35.1 19.2 74.6 29.3 115.1 29.3h.1c120.3 0 219.9-99.5 219.9-219.9 0-59.3-23.1-115.1-61-156.4zM223.9 438.6c-36.9 0-73.2-9.9-104.7-28.6l-7.5-4.5-63.4 22.5 21.2-64.8-4.9-8C43.6 321.6 32 287.1 32 251.9 32 149 121 60 223.9 60c52 0 100.8 20.3 137.4 57.1 36.6 36.9 57 85.8 56.9 137.9 0 102.9-89 183.6-194.3 183.6zm107.8-138.2c-5.9-3-34.9-17.2-40.3-19.2-5.4-2-9.3-3-13.3 3  -3.9 5.9-15.2 19.2-18.6 23.1-3.4 3.9-6.8 4.4-12.7 1.5-5.9-3-24.8-9.1-47.4-29-17.5-15.6-29.4-34.9-32.8-40.8-3.4-5.9-.4-9.1 2.6-12 2.7-2.6 5.9-6.8 8.8-10.2 3-3.4 3.9-5.9 5.9-9.8 2-3.9 1-7.4-.5-10.4-1.5-3-13.3-32.1-18.2-43.9-4.8-11.5-9.7-10-13.3-10.2-3.4-.2-7.4-.2-11.4-.2s-10.4 1.5-15.8 7.4c-5.4 5.9-20.7 20.3-20.7 49.3s21.2 57.2 24.1 61.1c3 3.9 41.7 63.7 100.8 89.4 14.1 6.1 25.1 9.8 33.7 12.6 14.1 4.5 26.9 3.9 37.1 2.4 11.3-1.7 34.9-14.3 39.8-28.1 4.9-13.7 4.9-25.5 3.4-28.1-1.3-2.4-5.4-3.9-11.3-6.8z'/%3E%3C/svg%3E"/>
      </a>
    </section>
  </main>

  <!-- LIGHTBOX / SLIDER -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Galeria">
    <div class="frame">
      <div class="hero">
        <img id="slideImg" alt="Imagem da galeria" />
      </div>
      <div class="bar">
        <div class="label" id="label"> </div>
        <div class="controls">
          <button class="btn" id="prev">◀︎ Anterior</button>
          <button class="btn" id="next">Próximo ▶︎</button>
          <button class="btn" id="close">Fechar ✕</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================
    // CONFIGURE SUAS IMAGENS AQUI
    // Basta substituir os caminhos abaixo pelos seus arquivos.
    // Dica: crie as pastas /images/3d, /images/ilustracoes, /images/midias
    // =========================
    const galleries = {
      modelos3d: {
        label: 'Modelos 3D para Impressão',
        images: [
          // Ex.: 'images/3d/meow-01.jpg',
          // Coloque quantas quiser; o loop é infinito
          'https://i.imgur.com/l0HAyAe.png',
          'https://i.imgur.com/CILSNko.png',
          'https://i.imgur.com/Ibo6lyK.jpeg'
        ]
      },
      ilustracoes: {
        label: 'Ilustrações',
        images: [
          'https://i.imgur.com/ffj0QLf.png',
          'https://i.imgur.com/w16WF7w.png',
          'https://i.imgur.com/QL59lal.png'
        ]
      },
      midias: {
        label: 'Artes para Mídias Sociais',
        images: [
          'https://i.imgur.com/PgpJ7fo.png',
          'https://i.imgur.com/x90vcWQ.png',
          'https://i.imgur.com/dIKPJpP.png'
        ]
      }
    };

    // Pré-carregar imagens para evitar "piscadas"
    Object.values(galleries).forEach(g => g.images.forEach(src => { const i = new Image(); i.src = src; }));

    const tiles = document.querySelectorAll('.tile');
    const lightbox = document.getElementById('lightbox');
    const slideImg = document.getElementById('slideImg');
    const label = document.getElementById('label');
    const btnPrev = document.getElementById('prev');
    const btnNext = document.getElementById('next');
    const btnClose = document.getElementById('close');

    let current = 0;       // índice atual
    let activeKey = null;  // galeria ativa
    let timer = null;      // autoplay

    function show(idx){
      const g = galleries[activeKey];
      if(!g || g.images.length === 0) return;
      current = (idx + g.images.length) % g.images.length; // loop infinito
      slideImg.src = g.images[current];
      label.textContent = `${g.label} · ${current+1}/${g.images.length}`;
    }

    function startAuto(){
      stopAuto();
      timer = setInterval(() => show(current + 1), 2600); // muda a cada 2.6s
    }
    function stopAuto(){ if(timer){ clearInterval(timer); timer = null; } }

    function openGallery(key){
      activeKey = key; current = 0; show(0); startAuto();
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden','false');
    }
    function closeGallery(){ stopAuto(); activeKey=null; lightbox.classList.remove('open'); lightbox.setAttribute('aria-hidden','true'); }

    tiles.forEach(t => t.addEventListener('click', () => openGallery(t.dataset.gallery)));
    tiles.forEach(t => t.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openGallery(t.dataset.gallery);} }));

    btnNext.addEventListener('click', ()=>{ show(current+1); startAuto(); });
    btnPrev.addEventListener('click', ()=>{ show(current-1); startAuto(); });
    btnClose.addEventListener('click', closeGallery);

    // Fechar ao clicar fora ou pressionar ESC
    lightbox.addEventListener('click', (e)=>{ if(e.target === lightbox) closeGallery(); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeGallery(); });
  </script>
</body>
</html>
